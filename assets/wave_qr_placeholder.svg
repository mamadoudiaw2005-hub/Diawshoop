  <!-- Wave Penguin & Typography Silhouette -->
  <text x="150" y="146" text-anchor="middle" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" font-style="italic" letter-spacing="-0.5">wave</text>
  <path d="M142,156 Q150,152 158,156 Q150,162 142,156 Z" fill="#ffffff"/>
